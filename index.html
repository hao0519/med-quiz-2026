<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>医药产品培训题库</title>
<style>
:root{--primary:#2b6cb0;--primary-light:#ebf4ff;--success:#38a169;--success-light:#f0fff4;--danger:#e53e3e;--danger-light:#fff5f5;--warning:#dd6b20;--warning-light:#fffaf0;--gray:#718096;--gray-light:#edf2f7;--bg:#f7fafc;--text:#1a202c;--text-light:#4a5568;--shadow:0 2px 8px rgba(0,0,0,.06);--shadow-lg:0 10px 30px rgba(0,0,0,.08)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;min-height:100vh}
.container{max-width:720px;margin:0 auto;padding:16px}
header{background:linear-gradient(135deg,#2b6cb0,#4299e1);color:#fff;padding:26px 16px 34px;text-align:center;border-radius:0 0 26px 26px;box-shadow:var(--shadow-lg);margin-bottom:20px}
header h1{font-size:22px;font-weight:700;margin-bottom:6px;letter-spacing:1px}
header p{font-size:13px;opacity:.92}
.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:13px 22px;border-radius:26px;border:none;cursor:pointer;font-size:15px;font-weight:500;transition:.15s;-webkit-tap-highlight-color:transparent;letter-spacing:.5px}
.btn-primary{background:var(--primary);color:#fff;flex:1}
.btn-primary:active{transform:scale(.97)}
.btn-secondary{background:var(--gray-light);color:var(--text-light);flex:1}
.btn-ghost{background:transparent;color:var(--primary);padding:10px 14px;font-size:14px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-block{width:100%;display:flex}
.btn-row{display:flex;gap:10px;margin-top:18px}
.product-list{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.product{background:#fff;border-radius:14px;padding:16px;cursor:pointer;box-shadow:var(--shadow);display:flex;align-items:center;gap:14px;transition:.15s;border:2px solid transparent}
.product:active{transform:scale(.98);border-color:var(--primary)}
.product .icon{width:50px;height:50px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:23px;color:#fff;flex-shrink:0}
.product .info{flex:1;min-width:0}
.product .info h3{font-size:15px;font-weight:600;margin-bottom:4px}
.product .info p{font-size:12px;color:var(--gray)}
.product .arrow{color:var(--gray);font-size:20px;font-weight:600}
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--gray-light)}
.setting-row:last-child{border-bottom:none}
.setting-row label{font-size:15px;color:var(--text-light)}
.setting-row .opts{display:flex;gap:8px}
.opt-chip{padding:6px 15px;border-radius:18px;background:var(--gray-light);color:var(--text-light);font-size:13px;cursor:pointer;border:1.5px solid transparent;transition:.15s;user-select:none}
.opt-chip.active{background:var(--primary-light);color:var(--primary);border-color:var(--primary);font-weight:600}
.progress-bar{width:100%;height:6px;background:var(--gray-light);border-radius:3px;overflow:hidden}
.progress-bar .fill{height:100%;background:linear-gradient(90deg,var(--primary),#63b3ed);border-radius:3px;transition:width .3s}
.q-stem{font-size:16px;line-height:2.0;margin-bottom:18px;font-weight:500;color:var(--text)}
.q-blank-input{display:inline-block;width:120px;padding:2px 6px;margin:0 3px;border:none;border-bottom:2px solid var(--primary);background:#f0f7ff;border-radius:4px 4px 0 0;font-size:15px;color:var(--text);text-align:center;outline:none;vertical-align:middle;font-family:inherit}
.q-blank-input:focus{border-bottom-color:#2b6cb0;background:#e3f0ff}
.q-blank-input[disabled]{border-bottom-style:dotted;background:#f7fafc;color:#718096}
.q-options{display:flex;flex-direction:column;gap:11px}
.option{padding:14px 16px;border-radius:12px;cursor:pointer;background:#fff;border:1.5px solid var(--gray-light);transition:.15s;display:flex;align-items:flex-start;gap:11px;font-size:15px;line-height:1.55}
.option:active{transform:scale(.99)}
.option .letter{width:26px;height:26px;border-radius:50%;background:var(--gray-light);color:var(--text-light);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;transition:.15s}
.option.selected{border-color:var(--primary);background:var(--primary-light)}
.option.selected .letter{background:var(--primary);color:#fff}
.option.multi .letter::before{content:"☐ ";font-size:14px}
.option.multi.selected .letter::before{content:"☑ ";color:#fff}
.option.correct{border-color:var(--success);background:var(--success-light)}
.option.correct .letter{background:var(--success);color:#fff}
.option.wrong{border-color:var(--danger);background:var(--danger-light)}
.option.wrong .letter{background:var(--danger);color:#fff}
.option.locked{cursor:default}
.option.judge{padding:18px 16px;min-height:68px;justify-content:flex-start;gap:14px}
.option.judge > div:last-child{font-size:17px;font-weight:500;line-height:1.5}
.option.judge.selected > div:last-child{font-weight:600}
.letter.judge-letter{font-size:26px;line-height:1;width:46px;height:46px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-weight:bold}
.letter.judge-letter.right{background:rgba(56,161,105,0.18);color:#38a169}
.letter.judge-letter.wrong{background:rgba(229,62,62,0.18);color:#e53e3e}
.letter.judge-letter.right::before{content:"✓"}
.letter.judge-letter.wrong::before{content:"✗"}
.explain-box{margin-top:16px;padding:14px 16px;border-radius:12px;background:var(--warning-light);border:1px solid #fbd38d;font-size:14px;line-height:1.75;color:var(--text-light)}
.explain-box .label{font-weight:700;color:var(--warning);margin-right:6px}
.q-footer{display:flex;justify-content:space-between;align-items:center;margin-top:18px;padding-top:14px;border-top:1px solid var(--gray-light);font-size:13px;color:var(--gray)}
.result-summary{text-align:center;padding:26px 20px}
.result-summary .score{font-size:52px;font-weight:800;background:linear-gradient(135deg,var(--primary),#63b3ed);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
.result-summary .label{font-size:15px;color:var(--gray);margin-bottom:22px}
.result-row{display:flex;justify-content:space-around;margin-bottom:22px}
.result-row .item{text-align:center}
.result-row .item .num{font-size:24px;font-weight:700;margin-bottom:4px}
.result-row .item .lbl{font-size:12px;color:var(--gray)}
.crumb{font-size:13px;color:var(--gray);margin-bottom:12px}
.hidden{display:none}
.empty{text-align:center;padding:60px 20px;color:var(--gray)}
.empty .icon{font-size:52px;margin-bottom:12px;opacity:.7}
.q-type-info{font-size:12px;color:var(--gray);margin-bottom:8px}
.stats-text{font-size:12px;color:var(--gray);margin-top:8px;line-height:1.6}
.footer-note{text-align:center;font-size:11px;color:#a0aec0;margin:24px 0 18px;padding:0 20px;line-height:1.7}
.pill{display:inline-block;padding:2px 9px;border-radius:6px;font-size:11px;font-weight:500;vertical-align:middle}
.pill-blue{background:#e0e7ff;color:#3730a3}
.pill-green{background:#c6f6d5;color:#22543d}
/* ===== 搜索 ===== */
.search-wrap{margin-bottom:14px}
.search-box{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:6px 14px;box-shadow:var(--shadow);border:1.5px solid var(--gray-light);transition:.15s}
.search-box:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
.search-box .s-icon{font-size:18px;opacity:.7}
.search-box input{flex:1;border:none;outline:none;font-size:15px;padding:10px 0;background:transparent;color:var(--text);font-family:inherit}
.search-box button{background:none;border:none;font-size:15px;color:var(--primary);cursor:pointer;padding:6px;display:flex;align-items:center}
.search-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.search-tag{padding:4px 11px;border-radius:14px;background:var(--gray-light);color:var(--text-light);font-size:12px;cursor:pointer;transition:.13s}
.search-tag.active{background:var(--primary);color:#fff}
.s-result-count{font-size:12px;color:var(--gray);margin:4px 2px 10px}
.s-item{border:1.5px solid var(--gray-light);border-radius:14px;background:#fff;padding:14px;margin-bottom:10px;transition:.15s}
.s-item.hot{border-color:var(--primary);background:var(--primary-light)}
.s-item .s-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.s-item .s-prod{font-size:12px;color:var(--primary);font-weight:600}
.s-item .s-stem{font-size:15px;line-height:1.7;color:var(--text);font-weight:500}
.s-item .s-stem mark{background:#fff3bf;border-radius:3px;padding:0 1px}
.s-item .s-opts{margin-top:10px;display:flex;flex-direction:column;gap:7px}
.s-item .s-opt{font-size:13px;color:var(--text-light);line-height:1.5}
.s-item .s-opt.correct{color:var(--success);font-weight:600}
.s-item .s-meta{margin-top:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--gray)}
.s-actions{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.s-actions .link{border:1px solid var(--gray-light);background:#fff;color:var(--text-light);padding:5px 12px;border-radius:9px;font-size:12px;cursor:pointer;transition:.13s}
.s-actions .link:active{background:var(--gray-light)}
.s-actions .link.show{background:var(--primary);border-color:var(--primary);color:#fff}
.s-empty{display:none}
/* ===== 自定义确认弹窗 ===== */
.confirm-mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:999;display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;visibility:hidden;transition:.18s}
.confirm-mask.on{opacity:1;visibility:visible}
.confirm-box{width:100%;max-width:300px;background:#fff;border-radius:16px;padding:24px 20px 16px;box-shadow:0 10px 40px rgba(0,0,0,.25);transform:translateY(8px);transition:.18s}
.confirm-mask.on .confirm-box{transform:translateY(0)}
.confirm-msg{font-size:15px;color:var(--text);text-align:center;line-height:1.6;margin-bottom:20px}
.confirm-row{display:flex;gap:10px}
.confirm-row .btn{flex:1;justify-content:center}
  .q-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:8px;background:#fff;
    border-radius:12px;padding:12px;box-shadow:var(--shadow);max-height:260px;overflow-y:auto;
  }
  .q-grid .gel{
    display:flex;align-items:center;justify-content:center;height:34px;border-radius:9px;
    font-size:13px;font-weight:600;color:var(--text-light);background:var(--gray-light);cursor:pointer;user-select:none;transition:.12s;
  }
  .q-grid .gel:active{transform:scale(.93)}
  .q-grid .gel.cur{background:var(--primary);color:#fff}
  .q-grid .gel.done{background:var(--success-light);color:var(--success);border:1.5px solid var(--success)}
  .q-grid .gel.essay{background:var(--warning-light);color:var(--warning)}
  .q-grid .gel.cur.done{background:var(--primary);color:#fff;border:none}
  .q-grid .legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px;font-size:12px;color:var(--gray)}
  .q-grid .legend i{display:inline-block;width:16px;height:16px;border-radius:4px;vertical-align:-3px;margin-right:4px}
</style>
</head>
<body>

<header>
  <h1>💊 医药产品培训题库</h1>
  <p>八个产品 · 上千道真题 · 在线刷题巩固</p>
</header>

<div class="container">
  <div id="view-home">
    <div class="card">
      <h2 style="font-size:17px;font-weight:600;margin-bottom:4px">🔍 搜索题目</h2>
      <div class="search-wrap">
        <div class="search-box">
          <span class="s-icon">🔎</span>
          <input id="home-search-input" type="search" placeholder="输入关键词，如：帕金森、适应症、用量…" autocomplete="off" />
          <button id="home-search-btn" title="搜索">搜索</button>
        </div>
        <div class="search-tags" id="home-search-tags"></div>
      </div>
    </div>
    <div class="card">
      <h2 style="font-size:17px;font-weight:600;margin-bottom:4px">📝 在线考试</h2>
      <p style="font-size:13px;color:var(--gray)">随机抽题组卷 · 满分 100 分 · 分题型计分</p>
      <div id="exam-list" class="product-list"></div>
    </div>
    <div class="card">
      <h2 style="font-size:17px;font-weight:600;margin-bottom:4px">📚 选择产品开始刷题</h2>
      <p style="font-size:13px;color:var(--gray)">支持顺序/随机，可反复练习并分享</p>
      <div id="product-list" class="product-list"></div>
    </div>
    <p class="footer-note">本题库由培训资料整理生成 · 支持微信内直接使用</p>
  </div>

  <div id="view-search" class="hidden">
    <div class="crumb">← <span id="search-back" style="cursor:pointer;color:var(--primary)">返回首页</span></div>
    <div class="card">
      <div class="search-box">
        <span class="s-icon">🔎</span>
        <input id="s-input" type="search" placeholder="搜索题干 / 选项 / 解析…" autocomplete="off" />
        <button id="s-btn" title="搜索">搜索</button>
      </div>
      <div class="search-tags" id="s-tags"></div>
    </div>
    <div id="s-result"></div>
    <div class="btn-row" style="margin-top:4px"><button class="btn btn-secondary btn-block" id="s-back2">返回首页</button></div>
  </div>

  <div id="view-settings" class="hidden">
    <div class="crumb">← <span id="crumb-back" style="cursor:pointer;color:var(--primary)">返回首页</span></div>
    <div class="card">
      <h2 id="settings-title" style="font-size:17px;font-weight:600;margin-bottom:16px"></h2>
      <div class="setting-row"><label>题目数量</label>
        <div class="opts" id="count-opts">
          <div class="opt-chip" data-v="10">10</div><div class="opt-chip" data-v="20">20</div><div class="opt-chip" data-v="50">50</div><div class="opt-chip" data-v="all">全部</div>
        </div></div>
      <div class="setting-row"><label>出题顺序</label>
        <div class="opts" id="mode-opts">
          <div class="opt-chip active" data-v="seq">顺序</div><div class="opt-chip" data-v="rand">随机</div>
        </div></div>
      <div id="settings-stats" class="stats-text"></div>
      <button class="btn btn-primary btn-block" id="btn-start" style="margin-top:22px">开始答题 →</button>
    </div>
  </div>

  <div id="view-quiz" class="hidden">
    <div class="crumb"><span id="quiz-product-name"></span> · <span id="quiz-progress"></span></div>
    <div class="progress-bar"><div class="fill" id="quiz-progress-fill" style="width:10%"></div></div>
    <button class="btn btn-ghost btn-block" id="btn-grid" style="margin-top:8px;font-size:13px">🧭 展开题目导航（可自由跳转）</button>
    <div id="q-grid" class="q-grid hidden" style="margin-top:10px"></div>
    <div class="card">
      <div id="q-type-info"></div>
      <div class="q-stem" id="q-stem"></div>
      <div class="q-options" id="q-options"></div>
      <div id="q-explain" class="hidden"></div>
      <div class="q-footer"><span id="q-tip">点击选项提交</span><span id="q-nav"></span></div>
    </div>
    <div class="btn-row">
      <button class="btn btn-secondary" id="btn-prev">← 上一题</button>
      <button class="btn btn-primary" id="btn-next" disabled>下一题 →</button>
    </div>
    <button class="btn btn-ghost btn-block" id="btn-exit" style="margin-top:16px">退出答题</button>
  </div>

  <div id="view-result" class="hidden">
    <div class="card">
      <div class="result-summary">
        <div class="score" id="r-score">--</div>
        <div class="label" id="r-label">本次成绩</div>
        <div class="result-row">
          <div class="item"><div class="num" id="r-correct" style="color:var(--success)">0</div><div class="lbl">答对</div></div>
          <div class="item"><div class="num" id="r-wrong" style="color:var(--danger)">0</div><div class="lbl">答错</div></div>
          <div class="item"><div class="num" id="r-total">0</div><div class="lbl">计分题</div></div>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn btn-secondary" id="btn-home">返回首页</button>
        <button class="btn btn-primary" id="btn-retry">再来一次</button>
      </div>
      <button class="btn btn-ghost btn-block" id="btn-review" style="margin-top:12px">查看错题与解析 →</button>
    </div>
  </div>

  <div id="view-review" class="hidden">
    <div class="crumb">← <span id="review-back" style="cursor:pointer;color:var(--primary)">返回成绩</span></div>
    <div id="review-list"></div>
    <div class="btn-row"><button class="btn btn-primary btn-block" id="review-home">返回首页</button></div>
  </div>

  <div id="view-exam-result" class="hidden">
    <div class="card">
      <div class="result-summary">
        <div class="score" id="er-score">-- / 100</div>
        <div class="label" id="er-label">考试得分</div>
        <div class="result-row">
          <div class="item"><div class="num" id="er-correct" style="color:var(--success)">0</div><div class="lbl">答对</div></div>
          <div class="item"><div class="num" id="er-wrong" style="color:var(--danger)">0</div><div class="lbl">答错</div></div>
          <div class="item"><div class="num" id="er-total">0</div><div class="lbl">总题数</div></div>
        </div>
        <div id="er-bytype" style="margin-top:8px"></div>
      </div>
      <div class="btn-row">
        <button class="btn btn-secondary" id="er-home">返回首页</button>
        <button class="btn btn-primary" id="er-retry">再来一场</button>
      </div>
      <button class="btn btn-ghost btn-block" id="er-review" style="margin-top:12px">查看错题与解析 →</button>
    </div>
  </div>
</div>

<div class="confirm-mask" id="confirm-mask">
  <div class="confirm-box">
    <div class="confirm-msg" id="confirm-msg"></div>
    <div class="confirm-row">
      <button class="btn btn-ghost" id="confirm-cancel">取消</button>
      <button class="btn btn-primary" id="confirm-ok">确定</button>
    </div>
  </div>
</div>

<script>

B": "错误"}, "answer": "B", "explain": "", "type": "judge"}, {"stem": "LSS患者的术后残留麻木和疼痛症状，通常在术后2周完全消失。", "options": {"A": "正确", "B": "错误"}, "answer": "B", "explain": "", "type": "judge"}, {"stem": "利马前列素片的不良反应发生率为9.1%。", "options": {"A": "正确", "B": "错误"}, "answer": "B", "explain": "", "type": "judge"}, {"stem": "利马前列素片应避免与抗血小板药、溶栓药、抗凝药联合使用。", "options": {"A": "正确", "B": "错误"}, "answer": "B", "explain": "", "type": "judge"}, {"stem": "神经源性跛行下蹲弯腰后椎管容积扩大，症状缓解。", "options": {"A": "正确", "B": "错误"}, "answer": "A", "explain": "", "type": "judge"}, {"stem": "请列出LSS传统药物保守治疗中常见的至少3类药物，每类举例2种，分别说明其主要作用机制，并比较其相对于凯立通的主要局限。", "options": {}, "answer": "LSS传统药物保守治疗中常见的5类药物及比较如下：1.NSAIDs：如塞来昔布、依托度酸。机制：抑制环氧化酶，减少前列腺素合成，减轻炎性疼痛。局限：对症镇痛，对神经源性跛行及受压神经缺血针对性有限。2.阿片类镇痛药：如羟考酮、曲马多。机制：激动阿片受体或抑制去甲肾上腺素和5-羟色胺再摄取。局限：耐受、依赖、嗜睡等。3.神经病理性疼痛药/抗癫痫药：如加巴喷丁、普瑞巴林。机制：与电压门控钙通道α2δ亚基结合，减少兴奋性递质释放。局限：研究结果不一致，可能引起眩晕嗜睡。4.肌肉松弛剂：如乙哌立松、替扎尼定。机制：降低脊髓反射及肌张力，缓解肌痉挛。局限：主要针对伴随肌痉挛，LSS特异性证据有限。5.神经营养药：如甲钴胺、腺苷钴胺。机制：作为维生素B12活性辅酶参与神经髓鞘修复。局限：起效慢，单药证据有限。凯立通为PGE1衍生物，通过扩张血管、抑制血小板聚集改善受压神经微循环，更贴近LSS神经受压合并缺血的病理环节。规范沟通需遵循说明书适应症、禁忌和慎用要求。", "type": "essay"}, {"stem": "请简述利马前列素(凯立通⑧) 治疗腰椎管狭窄症的药理作用机制及其主要临床获益。", "options": {}, "answer": "（1）机制：利马前列素是PGE1衍生物，通过作用于IP受体和EP2/EP4受体激活cAMP信号通路，舒张血管，改善神经微循环；抑制血小板聚集，改善红细胞变形能力。（2）主要临床获益：全面缓解LSS三大症状（腰部及下肢疼痛、麻木、行走能力障碍）；提高JOA评分改善率达38.9%；改善患者生活质量和睡眠质量。", "explain": "", "type": "essay"}, {"stem": "请结合指南推荐和临床证据(至 口题目反馈 少5个),阐述利马前列素在LSS全程管理中的定位及拓展应用方向。", "options": {}, "answer": "（1）指南推荐地位：利马前列素获多部权威指南推荐，包括NASS循证临床指南、日本骨科协会LSS诊疗指南、日本疼痛治疗指南等。（2）全程管理定位：是LSS全程管理基础用药，可贯穿腰椎管狭窄症各严重程度治疗。（3）保守治疗阶段用于提高行走能力、减轻下肢麻木疼痛；术后用于减轻残留麻木和疼痛；可与NSAIDs等药物联合使用。", "explain": "", "type": "essay"}]}, {"id": "p4", "name": "合规与项目费用管理", "topic": "公司合规", "count": 689, "questions": [{"stem": "违纪违规行为涉及金额或因违纪违规行为造成公司的经济损失（）的，构成严重违纪违规行为。", "options": {"A": "1000元（含本数）以上，不足3000元", "B": "5000元（含本数）以上", "C": "1000元（含本数）以上，不足5000元", "D": "不足1000元"}, "answer": "B", "explain": "", "type": "single"}, {"stem": "自办学术会议的地点应当从交通和安全方面的考虑是适当的，下列描述错误的是？", "options" 摄餐食、礼品，不用拍摄主题横幅全景。", "options": {"A": "正确", "B": "错误"}, "answer": "B", "explain": "", "type": "judge"}, {"stem": "公司向非营利机构或公益组织的赠药，不得与公司产品的采购或使用相挂钩。", "options": {"A": "正确", "B": "错误"}, "answer": "A", "explain": "", "type": "judge"}, {"stem": "品牌提示物单价超过 100 元合规可报销。", "options": {"A": "正确", "B": "错误"}, "answer": "B", "explain": "", "type": "judge"}, {"stem": "多场次会议可合并只建一个活动。", "options": {"A": "正确", "B": "错误"}, "answer": "B", "explain": "", "type": "judge"}, {"stem": "党建活动应当保持红色、爱国爱党主题，照片应当庄严正式。", "options": {"A": "正确", "B": "错误"}, "answer": "A", "explain": "", "type": "judge"}, {"stem": "公司邀请相关领域专家参加学术活动并为其提供会议支持，但不得承担其陪同人员的费用。", "options": {"A": "正确", "B": "错误"}, "answer": "A", "explain": "", "type": "judge"}, {"stem": "药品样品提供的目的，是为了使患者获益，因此可以任意将样品作为礼品提供给医疗机构或个人。", "options": {"A": "正确", "B": "错误"}, "answer": "B", "explain": "", "type": "judge"}, {"stem": "在学术会议申请中，活动开始时间字段应填写会议实际召开的开始和结束时间。", "options": {"A": "正确", "B": "错误"}, "answer": "A", "explain": "", "type": "judge"}, {"stem": "推广用品设计制作费需提供成品实拍照片。", "options": {"A": "正确", "B": "错误"}, "answer": "A", "explain": "", "type": "judge"}, {"stem": "新建活动的地点应当填写具体准确的地址，而非简单写道某城市或某医院", "options": {"A": "正确", "B": "错误"}, "answer": "A", "explain": "", "type": "judge"}, {"stem": "项目预算生效后，需要先激活（新增活动上报）才能开通会中小程序。", "options": {"A": "正确", "B": "错误"}, "answer": "A", "explain": "", "type": "judge"}, {"stem": "预算项目执行率低于 60%，预算上报人累计扣 10 分。", "options": {"A": "正确", "B": "错误"}, "answer": "A", "explain": "", "type": "judge"}, {"stem": "预算虚报挪用：申报人单次扣 5 分。", "options": {"A": "正确", "B": "错误"}, "answer": "B", "explain": "", "type": "judge"}, {"stem": "拜访费用只计入日常推广费账户。", "options": {"A": "正确", "B": "错误"}, "answer": "B", "explain": "", "type": "judge"}, {"stem": "捐赠与资助必须由可以由受赠机构下设部门或个人接受。", "options": {"A": "正确", "B": "错误"}, "answer": "B", "explain": "", "type": "judge"}, {"stem": "学术名单造假涉及≥8 人，本人信用等级降一档。", "options": {"A": "正确", "B": "错误"}, "answer": "B", "explain": "", "type": "judge"}, {"stem": "差旅办公季度预算执行率＜80%，总监扣 1 分。", "options": {"A": "正确", "B": "错误"}, "answer": "B", "explain": "", "type": "judge"}, {"stem": "新建活动中，参会人员字段必须准确填写。", "options": {"A": "正确", "B": "错误"}, "answer": "A", "explain": "", "type": "judge"}, {"stem": "\"自办学术会议\"可以选在境外举办。", "type": "judge", "options": {"A": "正确", "B": "错误"}, "answer": "B", "explain": ""}, {"stem": "燃油报销核算标准：0.3 元 / 公里 × 同车人数。", "options": {"A": "正确", "B": "错误"}, "answer": "A", "explain": "", "type": "judge"}, {"stem": "如果一场学术会议，拟邀请的讲者并未在公司专家库内，可先请其进行讲课，会后再发起入库流程。", "options": {"A": "正确", "B": "错误"}, "answer": "B", "explain": "", "type": "judge"}, {"stem": "公司可以租用豪华轿车车型接送会议参会者。", "options": {"A": "正确", "B": "错误"}, "answer": "B", "explain": "", "type": "judge"}, {"stem": "业务类型自办 / 三方互转需要重新申请预算。", "options": {"A": "正确", "B": "错误"}, "answer": "A", "explain": "", "type": "judge"}, {"stem": "项目预算金额仅包含对公付款金额，不计算跟会差旅。", "options": {"A": "正确", "B": "错误"}, "answer": "B", "explain": "", "type": "judge"}, {"stem": "与医疗卫生专业人士开展互动交流活动的目的，在于提升医疗服务水平和造福患者。", "options": {"A": "正确", "B": "错误"}, "answer": "A", "explain": "", "type": "judge"}, {"stem": "C 级人员报销、拨款周期会延长。", "options": {"A": "正确", "B": "错误"}, "answer": "A", "explain": "", "type": "judge"}, {"stem": "公司可以采用有奖销售、免费赠送、附赠药品的方式销售药品。", "options": {"A": "正确", "B": "错误"}, "answer": "B", "explain": "", "type": "judge"}, {"stem": "美团私用、刷单，申报人扣 3 分。", "options": {"A": "正确", "B": "错误"}, "answer": "A", "explain": "", "type": "judge"}, {"stem": "主动上报虚假费用并退款，可获得5分信用加分。", "options": {"A": "正确", "B": "错误"}, "answer": "A", "explain": "", "type": "judge"}, {"stem": "业务员小张通过公司系统申请了10盒样品，计划在患教项目中向患者发放体验。", "options": {"A": "正确", "B": "错误"}, "answer": "B", "explain": "", "type": "judge"}, {"stem": "单次虚报≥2000 元信用等级下降一档。", "options": {"A": "正确", "B": "错误"}, "answer": "A", "explain": "", "type": "judge"}, {"stem": "对公汇款三类单据：报支、借款、报账单。", "options": {"A": "正确", "B": "错误"}, "answer": "A", "explain": "", "type": "judge"}, {"stem": "开展党建活动前，需要由公司党委向医院党委/支部发函，并得到对方回函后再开展", "options": {"A": "正确", "B": "错误"}, "answer": "A", "explain": "", "type": "judge"}, {"stem": "三方会下，可以报销参会HCP的个人餐费。", "options": {"A": "正确", "B": "错误"}, "answer": "B", "explain": "", "type": "judge"}, {"stem": "聘请的专家应自行准备提供演讲的内容，保持独立性，不受任何一方施加的不正当影响。", "options": {"A": "正确", "B": "错误"}, "answer": "A", "explain": "", "type": "judge"}, {"stem": "参加由第三方非营利机构组织的境外国际学术会议，公司仅可以通过赞助或捐赠提供支持。", "options": {"A": "正确", "B": "错误"}, "answer": "A", "explain": "", "type": "judge"}, {"stem": "销售代表新增预算时，可以勾选全事业部成本中心。", "options": {"A": "正确", "B": "错误"}, "answer": "B", "explain": "", "type": "judge"}, {"stem": "办事处房租报销需要正规租赁合同和公司抬头发票。", "options": {"A": "正确", "B": "错误"}, "answer": "A", "explain": "", "type": "judge"}, {"stem": "税务查出虚开发票当事人 D 级。", "options": {"A": "正确", "B": "错误"}, "answer": "A", "explain": "", "type": "judge"}, {"stem": "为提高产品宣传效率，即将完成注册审批的新适应症，可以提前通过广告或推广资料进行宣传。", "options": {"A": "正确", "B": "错误"}, "answer": "B", "explain": "", "type": "judge"}, {"stem": "医学教育用品允许学术场景使用。", "options": {"A": "正确", "B": "错误"}, "answer": "A", "explain": "", "type": "judge"}, {"stem": "云梯项目预算表单分为会议、非会议、公益党建三类模板。", "options": {"A": "正确", "B": "错误"}, "answer": "A", "explain": "", "type": "judge"}, {"stem": "推广用品预算按月线下填写申请表申报。", "options": {"A": "正确", "B": "错误"}, "answer": "A", "explain": "", "type": "judge"}, {"stem": "公司样品提供的对象，不一定是医疗卫生机构中对样品具备处方权的医疗卫生专业人士，也可以向患者或一般公众直接提供处方药样品。", "options": {"A": "正确", "B": "错误"}, "answer": "B", "explain": "", "type": "judge"}, {"stem": "听诊器、医学挂图属于医学教育用品范畴。", "options": {"A": "正确", "B": "错误"}, "answer": "A", "explain": "", "type": "judge"}, {"stem": "所有员工首月信用基础分为 100 分，初始等级 B。", "options": {"A": "正确", "B": "错误"}, "answer": "A", "explain": "", "type": "judge"}, {"stem": "D 级为最后 10% 且分数低于 60，暂停预算、核销审批权限。", "options": {"A": "正确", "B": "错误"}, "answer": "A", "explain": "", "type": "judge"}, {"stem": "不得直接邀请或赞助医疗卫生人士或政府工作人员个人赴境外参加国际学术会议、进修项目或考察。", "options": {"A": "正确", "B": "错误"}, "answer": "A", "explain": "", "type": "judge"}, {"stem": "客户拜访后的合规简餐允许使用拜访用餐。", "options": {"A": "正确", "B": "错误"}, "answer": "A", "explain": "", "type": "judge"}, {"stem": "地区经理、RPM、LKA 月度额度均为 3000 元，均使用运营费账户申请。", "options": {"A": "正确", "B": "错误"}, "answer": "B", "explain": "", "type": "judge"}, {"stem": "如使用会中管理小程序的自办学术会议，进行现场拍照时，应分别对会议规模类和每位讲者提供服务类进行拍照上传。", "options": {"A": "正确", "B": "错误"}, "answer": "A", "explain": "", "type": "judge"}, {"stem": "非平台餐饮商家报销需要门头照 + 营业执照。", "options": {"A": "正确", "B": "错误"}, "answer": "A", "explain": "", "type": "judge"}, {"stem": "拜访用餐、用车仅能通过美团、I 随行支出。", "options": {"A": "正确", "B": "错误"}, "answer": "A", "explain": "", "type": "judge"}, {"stem": "新建活动中，可以不填写计划的参与人员。", "options": {"A": "正确", "B": "错误"}, "answer": "B", "explain": "", "type": "judge"}, {"stem": "商务及会议餐饮的安排应满足适当、合理的原则，不选择奢华餐厅、私人会所以及娱乐场所进行餐饮招待。", "options": {"A": "正确", "B": "错误"}, "answer": "A", "explain": "", "type": "judge"}, {"stem": "加油费报销不需要行程里程佐证。", "options": {"A": "正确", "B": "错误"}, "answer": "B", "explain": "", "type": "judge"}, {"stem": "会议名称、举办地点、场次、时间变更走两级审批，不用重新申报预算。", "options": {"A": "正确", "B": "错误"}, "answer": "B", "explain": "", "type": "judge"}, {"stem": "三方独家赞助会议需要完整参会人员名单。", "options": {"A": "正确", "B": "错误"}, "answer": "A", "explain": "", "type": "judge"}, {"stem": "采购金额大于 3 万元无需招标比价。", "options": {"A": "正确", "B": "错误"}, "answer": "B", "explain": "", "type": "judge"}, {"stem": "医学教育用品单件上限 300 元，仅限医教相关物品。", "options": {"A": "正确", "B": "错误"}, "answer": "B", "explain": "", "type": "judge"}, {"stem": "代签参会名单属于学术造假扣分行为。", "options": {"A": "正确", "B": "错误"}, "answer": "A", "explain": "", "type": "judge"}, {"stem": "预算执行率低于 80% 就会产生扣分。", "options": {"A": "正确", "B": "错误"}, "answer": "A", "explain": "", "type": "judge"}, {"stem": "外部客户学术招待餐可以列支内部运营费。", "options": {"A": "正确", "B": "错误"}, "answer": "B", "explain": "", "type": "judge"}, {"stem": "顾问咨询会通常仅可以由医学部、市场部、大区经理及RPM以上职级发起", "options": {"A": "正确", "B": "错误"}, "answer": "A", "explain": "", "type": "judge"}, {"stem": "公司可以以现金的形式直接将参加活动的费用支付给会议参会者或者其所在单位。", "options": {"A": "正确", "B": "错误"}, "answer": "B", "explain": "", "type": "judge"}, {"stem": "内部差旅餐标事业部标  "", "type": "fill"}, {"stem": "多奈哌齐属于(1)靶点胆碱酯酶抑制剂，仅抑制AChE，对中晚期升高的(2)无抑制作用。", "options": {}, "answer": "(1)单(2)BuChE;丁酰胆碱酯酶", "explain": "", "type": "fill"}, {"stem": "利斯的明为_(1)_、_(2)_双重假性不可逆胆碱酯酶抑制剂，可覆盖AD全病程胆碱能损伤。", "options": {}, "answer": "(1)AChE;乙酰胆碱酯酶(2)BuChE;丁酰胆碱酯酶", "explain": "", "type": "fill"}, {"stem": "阿尔茨海默病诊断常用的两大认知量表为_(1)和_(2)。", "options": {}, "answer": "(1)MMSE;简易精神状态检查表(2)MoCA;蒙特利尔认知评估量表", "explain": "", "type": "fill"}, {"stem": "多奈哌齐的给药频次多为_(1)_，服药便捷性较高", "options": {}, "answer": "(1)每日一次;QD;一日一次", "explain": "", "type": "fill"}, {"stem": "利斯的明透皮剂型经(1)吸收，完全规避胃肠道刺激。", "options": {}, "answer": "(1)皮肤", "explain": "", "type": "fill"}, {"stem": "利斯的明贴剂不耐受可(1)终止药效，安全性可控。", "options": {}, "answer": "(1)即时撕除", "explain": "", "type": "fill"}, {"stem": "胆碱酯酶抑制剂通用给药原则是(1)起始，逐步滴定加量。", "options": {}, "answer": "(1)小剂量", "explain": "", "type": "fill"}, {"stem": "简述阿尔茨海默病的总体治疗原则。", "options": {}, "answer": "遵循尽早诊断、及时治疗、终身管理原则。对症药物可改善症状，抗Aβ免疫治疗可延缓认知衰退，需坚持长期治疗。伴精神行为异常者首选非药物干预，必要时加用抗精神病药并定期评估。", "explain": "", "type": "essay"}, {"stem": "简述胆碱酯酶抑制剂的临床应用核心要点。", "options": {}, "answer": "为轻中度AD一线用药，部分可用于中重度AD;存在明确量效关系，需逐步滴定剂量;单药无效或不耐受可换用其他品种或剂型;常见胃肠道不良反应。", "explain": "", "type": "essay"}, {"stem": "说明利斯的明透皮贴剂的作用机制。", "options": {}, "answer": "痴呆(如阿尔茨海默病)的病理学改变涉及胆碱能神经通路，从基底前脑到大脑皮质和海马。已知这些通路与注意力、学习、记忆和其他认知过程相关。利斯的明/卡巴拉汀是一种氨基甲酸酯型的脑选择性乙酰和丁酰-胆碱酯酶抑制剂。认为其作用机制是减缓经功能完整的胆碱能神经元释放的乙酰胆碱的降解，从而有助于胆碱能神经递质传递。来自动物研究的数据表明，利斯的明/卡巴拉汀可选择性的增加大脑皮质和海马中乙酰胆碱的表达。因此，本品可能对胆碱能介导的认知缺陷有改善作用;而阿尔茨海默病与胆碱能介导的认知缺陷有关。除此之外，已有证据表明，抑制胆碱酯酶可减缓淀粉样B-前体蛋自(APP)片段的形成，因此也减缓了淀粉样斑块的形成。而淀粉样斑块是阿尔茨海默病的主要病理学特征之一。 利斯的明/卡巴拉汀通过形成能使靶目标酶暂时失活的共价复合体而与该酶进行相互作用。在健康青年男性中，口服3.0mg利斯的明/卡巴拉汀可在服药后第一个1.5小时内降低脑脊液(CSF)中乙酰胆碱酯酶(AchE)活性近40%。在最大抑制作用后大约9小时，该酶的活性恢复至基线水平。在健康年轻受试者中，脑脊液中丁酰胆碱酯酶(BuChE)活性可被暂时抑制，在3.6小时后与基线值没有差异。在阿尔茨海默病患者脑脊液中，利斯的明/卡巴拉汀对CSF中乙酰胆碱酯酶的抑制作用呈剂量依赖性。最大剂量可达6mg2次/日，为试验中的最大剂量。利斯的明/卡巴拉汀对阿尔茨海默病患者脑脊液中丁酰胆碱酯酶活性的抑制作用与其对乙酰胆碱酯酶的抑制作用相似;在6mg2次/日给药后，其活性较基线水平改变超过60%。该项研究的最长时间为12个月，利斯的明/卡巴拉汀对脑脊液中乙酰胆碱酯酶和丁酰胆碱酯酶活性的抑制作用一直得到维持。已经发现，利斯的明/卡巴拉汀对脑脊液中乙酰胆碱酯酶和丁酰胆碱酯酶的抑制程度与阿尔茨海默病患者认知能力的变化具有统计学意义的相关性。但是，只有脑脊液中丁酰胆碱酯酶抑制与速度、注意力和记忆相关子测验具有明显和持续相关 性。", "explain": "痴呆(如阿尔茨海默病)的病理学改变涉及胆碱能神经通路，从基底前脑到大脑皮质和海马。已知这些通路与注意力、学习、记忆和其他认知过程相关。利斯的明/卡巴拉汀是一种氨基甲酸酯型的脑选择性乙酰和丁酰-胆碱酯酶抑制剂。认为其作用机制是减缓经功能完整的胆碱能神经元释放的乙酰胆碱的降解，从而有助于胆碱能神经递质传递。来自动物研究的数据表明，利斯的明/卡巴拉汀可选择性的增加大脑皮质和海马中乙酰胆碱的表达。因此，本品可能对胆碱能介导的认知缺陷有改善作用;而阿尔茨海默病与胆碱能介导的认知缺陷有关。除此之外，已有证据表明，抑制胆碱酯酶可减缓淀粉样B-前体蛋自(APP)片段的形成，因此也减缓了淀粉样斑块的形成。而淀粉样斑块是阿尔茨海默病的主要病理学特征之一。 利斯的明/卡巴拉汀通过形成能使靶目标酶暂时失活的共价复合体而与该酶进行相互作用。在健康青年男性中，口服3.0mg利斯的明/卡巴拉汀可在服药后第一个1.5小时内降低脑脊液(CSF)中乙酰胆碱酯酶(AchE)活性近40%。在最大抑制作用后大约9小时，该酶的活性恢复至基线水平。在健康年轻受试者中，脑脊液中丁酰胆碱酯酶(BuChE)活性可被暂时抑制，在3.6小时后与基线值没有差异。在阿尔茨海默病患者脑脊液中，利斯的明/卡巴拉汀对CSF中乙酰胆碱酯酶的抑制作用呈剂量依赖性。最大剂量可达6mg2次/日，为试验中的最大剂量。利斯的明/卡巴拉汀对阿尔茨海默病患者脑脊液中丁酰胆碱酯酶活性的抑制作用与其对乙酰胆碱酯酶的抑制作用相似;在6mg2次/日给药后，其活性较基线水平改变超过60%。该项研究的最长时间为12个月，利斯的明/卡巴拉汀对脑脊液中乙酰胆碱酯酶和丁酰胆碱酯酶活性的抑制作用一直得到维持。已经发现，利斯的明/卡巴拉汀对脑脊液中乙酰胆碱酯酶和丁酰胆碱酯酶的抑制程度与阿尔茨海默病患者认知能力的变化具有统计学意义的相关性。但是，只有脑脊液中丁酰胆碱酯酶抑制与速度、注意力和记忆相关子测验具有明显和持续相关 性。", "type": "essay"}, {"stem": "简述从利斯的明口服胶囊转换为利斯的明透皮贴剂的治疗方案", "options": {}, "answer": "口服利斯的明<6mg/日治疗的患者，可转换为4.6mg/24小时、每日一次的透皮贴剂；口服利斯的明6-12mg/日治疗的患者，可转换为9.5mg/24小时、每日一次的透皮贴剂。起始给药时机：在末次口服药物的第二天首次给予透皮贴剂治疗。", "explain": "", "type": "essay"}, {"stem": "根据2007年发表的《利斯的明透皮贴剂对比胶囊治疗阿尔茨海默病的6个月双盲随机安慰剂对照研究》简述利斯的明口服胶囊与透皮贴剂的疗效差异。", "options": {}, "answer": "第24周研究结果显示，利斯的明透皮贴剂与口服胶囊的ADAS-Cog评分较基线均下降0.6分，ADCS-ADL评分改善幅度相近，二者整体疗效相当;且两组在认知功能、日常生活能力维度的改善，均显著优于安慰剂组(p<0.05)。", "explain": "", "type": "essay"}, {"stem": "苏乐达的产品优势有哪些？", "options": {}, "answer": "机制独特，全病程获益:作为临床唯一双靶点胆碱酯酶抑制剂，可同时抑制AChE、BuChE，突破单靶点药物中晚期治疗瓶颈，覆盖阿尔茨海默病早、中、晚期全病程;假性不可逆抑制作用，药效稳定，对痴呆伴随的精神行为症状改善效果优异。 剂型优异，药效平稳高效:采用经皮缓释给药，规避肝脏首过代谢，生物利用度高;24小时匀速释药、无血药峰谷波动，彻底消除夜间药效空窗，可有效稳定患者夜间躁动、睡眠紊乱等问题，药效持续且均衡。", "explain": "机制独特，全病程获益:作为临床唯一双靶点胆碱酯酶抑制剂，可同时抑制AChE、BuChE，突破单靶点药物中晚期治疗瓶颈，覆盖阿尔茨海默病早、中、晚期全病程;假性不可逆抑制作用，药效稳定，对痴呆伴随的精神行为症状改善效果优异。 剂型优异，药效平稳高效:采用经皮缓释给药，规避肝脏首过代谢，生物利用度高;24小时匀速释药、无血药峰谷波动，彻底消除夜间药效空窗，可有效稳定患者夜间躁动、睡眠紊乱等问题，药效持续且均衡。", "type": "essay"}]}, {"id": "p8", "name": "罗替高汀贴片（帕金森病）", "topic": "产品知识", "count": 207, "questions     `;

    const ansBtn = div.querySelector(`#sans-${i}`);
    const ansBox = div.querySelector(`#sansbox-${i}`);
    ansBtn.onclick = ()=>{
      const isShow = ansBox.style.display!=='none';
      ansBox.style.display = isShow ? 'none' : 'block';
      ansBtn.textContent = isShow ? '查看答案' : '收起答案';
      if(!isShow){
        let ansHtml = '';
        if(q.answer){
          if(q.type==='judge') ansHtml = `<b>正确答案：</b>${q.answer==='A'?'正确 ✓':'错误 ✗'}`;
          else if(q.options && Object.keys(q.options).length) ansHtml = `<b>正确答案：</b>${q.answer.split('').join('、')}`;
          else ansHtml = `<b>参考答案：</b>${escapeHtml(q.answer)}`;
        } else ansHtml = '<b>📖 浏览题：</b>本题无标准答案';
        if(q.explain) ansHtml += `<div style="margin-top:6px"><b>解析：</b>${escapeHtml(q.explain)}</div>`;
        ansBox.innerHTML = ansHtml;

    // 去刷题：仅该题快速练习
    const playBtn = div.querySelector(`#sp-${i}`);

function openExam(ex){
  // 先提示考试规则
  const lines = ex.sections.map(s=>`${TYPE_TAG[s.type]} ${s.count} 题 × ${s.score} 分`).join('，');
  const totalPt = ex.sections.reduce((a,s)=>a+s.score*s.count,0);
  showConfirm(`即将开始「${ex.name}」\n${lines}\n满分 ${totalPt} 分，随机抽题。是否开始？`, ()=>startExam(ex));

function startExam(ex){
  // 按题型顺序从来源产品中随机抽取
  const picked = [];
  const scores = [];
  ex.sections.forEach(sec=>{
    // 汇总该题型在所有来源产品中的可判分题目
    const pool = [];
    ex.products.forEach(pname=>{
      const p = DATA.products.find(x=>x.name===pname);
      if(!p) return;
      p.questions.forEach(q=>{
        if(q.type===sec.type && isGradable(q)) pool.push(q);
      });
    });
    // 去重（按题干），再洗牌随机取
    const seen = new Set();
    const uniq = pool.filter(q=>{ const k=q.stem; if(seen.has(k)) return false; seen.add(k); return true; });
    shuffle(uniq);
    uniq.slice(0, sec.count).forEach(q=>{ picked.push({...q}); scores.push(sec.score); });
  });
  if(picked.length===0){ showConfirm('该考试来源产品中暂无可判分题目，请联系题库维护。', null); return; }
  // 初始化考试状态
  EXAM_MODE = true; examEntry = ex; examScores = scores;
  questions = picked; curIdx = 0; answers = new Array(questions.length).fill(null);
  currentProduct = null;
  document.getElementById('quiz-product-name').textContent = ex.name + '（考试）';
  document.getElementById('quiz-exam-badge') && (document.getElementById('quiz-exam-badge').textContent='考试');
  showView('view-quiz');
  resetGridUI();
  renderQuestion();
}

/* ====== 答题页 ====== */
function getBlankCount(stem){
  // 统计题干中编号空位数量：(1) (2) _2_ （1）（2）
  if(!stem) return 0;
  const re = /[_＿]?[（(]\s*\d+\s*[）)][_＿]?/g;
  const m = stem.match(re);
  return m ? m.length : 0;
}
function hasBlanks(q){
  return q && q.type === 'fill' && getBlankCount(q.stem||'') > 0;
}
function renderFillUI(){
  // 多空位填空：用独立输入框替换题干中的编号空位
  const q = questions[curIdx];
  const stem = q.stem || '';
  const parts = stem.split(/[_＿]?[（(]\s*\d+\s*[）)][_＿]?/);
  const n = getBlankCount(stem);
  let html = '';
  parts.forEach((seg, i)=>{
    html += escapeHtml(seg);
    if(i < n){
      html += `<input class="q-blank-input" data-blank="${i}" placeholder="空位 ${i+1}" autocomplete="off" />`;
    }
  });
  return {html, n};
}
function collectFillValues(){
  // 汇总当前填空/问答已输入内容
  const ta = document.getElementById('q-fill-input');
  if(ta) return ta.value.trim();
  const inputs = document.querySelectorAll('.q-blank-input');
  if(inputs.length){
    return Array.from(inputs).map(inp=>inp.value.trim());
  }
  return '';
}
function checkFillFilled(){
  const ta = document.getElementById('q-fill-input');
  if(ta) return ta.value.trim().length > 0;
  const inputs = document.querySelectorAll('.q-blank-input');
  return inputs.length ? Array.from(inputs).some(inp=>inp.value.trim().length>0) : true;
}
function resetGridUI(){
  const grid = document.getElementById('q-grid');
  const btn = document.getElementById('btn-grid');
  if(grid && !grid.classList.contains('hidden')) grid.classList.add('hidden');
  if(btn) btn.textContent = '🧭 展开题目导航（可自由跳转）';
}

function renderQGrid(){
  const grid = document.getElementById('q-grid');
  if(!grid) return;
  const show = !grid.classList.contains('hidden');
  if(!show) return;
  const legend =
    '<div class="legend">'+
      '<span><i style="background:var(--gray-light);border:1px solid #e2e8f0"></i>未答/浏览</span>'+
      '<span><i style="background:var(--success-light);border:1.5px solid var(--success)"></i>已答</span>'+
      '<span><i style="background:var(--warning-light);border:1px solid var(--warning)"></i>问答/浏览题</span>'+
      '<span><i style="background:var(--primary)"></i>当前位置</span>'+
    '</div>';
  let html = legend;
  questions.forEach((g,i)=>{
    const done = !!answers[i];
    const cls = ['gel'];
    if(i===curIdx) cls.push('cur');
    if(done && (g.type==='essay'||g.type==='fill')) cls.push('essay');
    else if(done) cls.push('done');
    html += `<div class="${cls.join(' ')}" data-idx="${i}">${i+1}</div>`;
  });
  grid.innerHTML = html;
  grid.querySelectorAll('.gel').forEach(el=>{
    el.addEventListener('click', ()=>{
      curIdx = parseInt(el.getAttribute('data-idx'),10);
      renderQuestion();
    });
  });
}

function toggleGrid(){
  const grid = document.getElementById('q-grid');
  const btn = document.getElementById('btn-grid');
  const show = grid.classList.toggle('hidden');
  btn.textContent = show ? '🧭 展开题目导航（可自由跳转）' : '🕳️ 收起题目导航';
  renderQGrid();
}

function renderQuestion(){
  // 把右侧主按钮切到“前进”模式（启用+去下一题/完成）
  function toForwardBtn(){
    const btn = document.getElementById('btn-next');
    btn.textContent = curIdx===questions.length-1 ? '完成 ✓' : '下一题 →';
    btn.disabled = false;
    btn.onclick = ()=>{
      if(curIdx<questions.length-1){curIdx++; renderQuestion();}
      else showFinalResult();
    };
  }
  const q = questions[curIdx];
  document.getElementById('quiz-progress').textContent = `${curIdx+1}/${questions.length}`;
  document.getElementById('quiz-progress-fill').style.width = `${(curIdx+1)/questions.length*100}%`;
  const type = q.type in TYPE_TAG ? q.type : 'single';
  const gradable = isGradable(q);
  let typeHTML = `<span class="q-type-info">📝 ${TYPE_TAG[type]||'单选题'}</span>`;
  if(EXAM_MODE && examScores[curIdx]) typeHTML += ` <span class="pill pill-blue">${examScores[curIdx]} 分</span>`;
  if(!gradable) typeHTML += ' <span class="pill pill-blue">📖 浏览题</span>';
  document.getElementById('q-type-info').innerHTML = typeHTML;
  // 多空位填空：题干中内嵌输入框；否则用纯文本题干
  const multiBlank = hasBlanks(q);
  if(multiBlank){
    const {html} = renderFillUI();
    document.getElementById('q-stem').innerHTML = `${curIdx+1}. ${html}`;
  } else {
    document.getElementById('q-stem').textContent = `${curIdx+1}. ${q.stem}`;
  }

  const optsEl = document.getElementById('q-options');
  optsEl.innerHTML = '';
  if(isChoice(q)){
    const keys = Object.keys(q.options);
    keys.forEach(L=>{
      const div = document.createElement('div');
      div.className = 'option' + (type==='multi' ? ' multi' : '') + (type==='judge' ? ' judge' : '');
      div.dataset.letter = L;
      // 判断题：字母位用图标代替，选项文字居中
      let letterHtml;
      if(type==='judge'){
        letterHtml = `<div class="letter judge-letter ${L==='A'?'right':'wrong'}"></div>`;
      } else {
        letterHtml = `<div class="letter">${L}</div>`;
      }
      div.innerHTML = `${letterHtml}<div>${escapeHtml(q.options[L])}</div>`;
      if(type==='multi'){
        div.onclick = ()=>toggleMultiOpt(L);
      } else {
        div.onclick = ()=>selectSingle(L);
      }
      optsEl.appendChild(div);
    });
  } else {
    // 填空/问答：显示文本输入框（多空位已在题干内嵌）
    const wrap = document.createElement('div');
    wrap.style.cssText = 'margin-top:6px';
    if(!multiBlank){
      const ta = document.createElement('textarea');
      ta.id = 'q-fill-input';
      ta.placeholder = '请输入您的答案...';
      ta.style.cssText = 'width:100%;min-height:90px;padding:14px;border:1.5px solid var(--gray-light);border-radius:12px;font-size:15px;line-height:1.6;font-family:inherit;resize:vertical;color:var(--text);background:#fff';
      ta.value = (typeof answers[curIdx]==='string' && !/^[A-F]+$/.test(answers[curIdx]||'') && answers[curIdx]) ? answers[curIdx] : '';
      ta.addEventListener('input', ()=>{
        if(type==='essay'||type==='fill'){
          document.getElementById('btn-next').disabled = !checkFillFilled();
        }
      });
      wrap.appendChild(ta);
    }
    // 如有提示
    if(gradable){
      const tip = document.createElement('div');
      tip.style.cssText = 'margin-top:8px;font-size:12px;color:var(--gray)';
      tip.textContent = multiBlank ? '请在题干空位中依次填入答案，填完后点击下方"完成 ✓"' : '填完后点击下方"完成 ✓"查看参考答案';
      wrap.appendChild(tip);
    }
    optsEl.appendChild(wrap);
  }

  document.getElementById('q-explain').classList.add('hidden');
  document.getElementById('q-explain').innerHTML = '';
  document.getElementById('q-tip').textContent = gradable ? (type==='multi'?'请选择所有正确答案（可多选）':'点击选项提交') : '本题为浏览题';
  document.getElementById('q-nav').textContent = '';
  // 下一题按钮初始化
  if(type==='multi'){
    document.getElementById('btn-next').textContent = '完成 ✓';
    document.getElementById('btn-next').onclick = submitMulti;
  } else if(type==='essay' || type==='fill'){
    document.getElementById('btn-next').textContent = '完成 ✓';
    document.getElementById('btn-next').onclick = submitFill;
  } else {
    toForwardBtn();
  }
  document.getElementById('btn-next').disabled = isChoice(q) ? true : false;
  // 问答/填空：默认启用按钮（让用户点查看参考答案/解析）
  if(type==='essay' || type==='fill'){
    // 多空位填空时若无输入则不启用判分
    const filled = checkFillFilled();
    document.getElementById('btn-next').disabled = !filled && gradable ? true : false;
    document.getElementById('btn-next').textContent = gradable ? '完成 ✓' : '查看答案';
    document.getElementById('btn-next').onclick = ()=>{
      const v = collectFillValues();
      const filledNow = checkFillFilled();
      if(gradable && filledNow && v){
        answers[curIdx] = v;
        showFillResult(v, false);
      } else {
        showFillResult(v || '（未填写）', false);
      }
      document.getElementById('btn-next').textContent = curIdx===questions.length-1 ? '完成 ✓' : '下一题 →';
      document.getElementById('btn-next').disabled = false;
      document.getElementById('btn-next').onclick = ()=>{
        if(curIdx<questions.length-1){curIdx++; renderQuestion();}
        else showFinalResult();
      };
    };
  }
  if(answers[curIdx] && type!=='essay' && type!=='fill'){
    showResult(answers[curIdx], true);
    // 已答过的选择题恢复后需重新启用主按钮，否则“下一题”点击无反应
    if(isChoice(q)) toForwardBtn();
  }
  renderQGrid();
}

function selectSingle(L){
  const q = questions[curIdx];
  if(answers[curIdx] && isChoice(q) && q.type!=='multi') return;
  answers[curIdx] = L;
  document.getElementById('btn-next').disabled = false;
  showResult(L, false);
}
function toggleMultiOpt(L){
  const q = questions[curIdx];
  let cur = answers[curIdx] ? answers[curIdx].split('') : [];
  if(cur.includes(L)) cur = cur.filter(x=>x!==L);
  else cur.push(L);
  cur.sort();
  answers[curIdx] = cur.join('');
  // 更新选中态
  document.querySelectorAll('#q-options .option').forEach(o=>{
    o.classList.toggle('selected', cur.includes(o.dataset.letter));
  });
  // 取消之前已显示的判分（多选可以随时改）
  document.getElementById('q-explain').classList.add('hidden');
  document.getElementById('q-explain').innerHTML = '';
  document.getElementById('q-nav').textContent = '';
  document.getElementById('q-tip').textContent = '选完后点击下方"完成 ✓"查看判分';
  document.getElementById('btn-next').disabled = cur.length===0;
}

function submitMulti(){
  // 多选提交
  const q = questions[curIdx];
  showResult(answers[curIdx]||'', false);
  if(curIdx<questions.length-1){
    document.getElementById('btn-next').textContent = '下一题 →';
  } else {
    document.getElementById('btn-next').textContent = '完成 ✓';
  }
  document.getElementById('btn-next').disabled = false;
  document.getElementById('btn-next').onclick = ()=>{
    if(curIdx<questions.length-1){curIdx++; renderQuestion();}
    else showFinalResult();
  };
}

function submitFill(){
  // 填空/问答提交：精确比对（允许忽略空格、全/半角/中英文标点差异）
  const q = questions[curIdx];
  const v = collectFillValues();
  if(!v || (Array.isArray(v) && !v.some(x=>x))){ alert('请输入答案'); return; }
  answers[curIdx] = Array.isArray(v) ? v.join('，') : v;
  showFillResult(v, false);
  if(curIdx<questions.length-1){
    document.getElementById('btn-next').textContent = '下一题 →';
  } else {
    document.getElementById('btn-next').textContent = '完成 ✓';
  }
  document.getElementById('btn-next').disabled = false;
  document.getElementById('btn-next').onclick = ()=>{
    if(curIdx<questions.length-1){curIdx++; renderQuestion();}
    else showFinalResult();
  };
}

function normalizeText(s){
  if(!s) return '';
  return String(s)
    .replace(/[\s\u00A0\u3000]/g,'')        // 去空格
    .replace(/[\uFF01-\uFF5E]/g, c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)) // 全角→半角
    .replace(/[。，、；：？！，．]/g,'')   // 去中英文标点
    .replace(/[,.!?;:]/g,'')
    .toLowerCase();
}

function isFillMatch(myAns, refAns){
  return normalizeText(myAns) === normalizeText(refAns);
}

function showFillResult(v, isRestoring){
  const q = questions[curIdx];
  const exp = document.getElementById('q-explain');
  exp.classList.remove('hidden');
  const isArr = Array.isArray(v);
  const joined = isArr ? v.filter(x=>x).join('，') : (v||'');
  const myStr = joined || '';
  let html = '';
  // 严格匹配：忽略空格/全半角/标点后必须完全一致
  let matched = false;
  if(q.answer && myStr){
    matched = isFillMatch(myStr, q.answer);
  }
  if(q.answer){
    const colored = isArr
      ? v.map((val, i)=>`<strong style="color:${ val && isFillMatch(val, (String(q.answer).split(/[，,、\s]+/)[i]||'') ) ? 'var(--success)' : 'var(--danger)'}">${escapeHtml(val||'（空）')}</strong>`).join('，')
      : `<strong style="color:${matched?'var(--success)':'var(--danger)'}">${escapeHtml(v)}</strong>`;
    html = `<div><span class="label">您的答案：</span>${colored}${matched?' <span style="color:var(--success);font-weight:600">✓ 答对</span>':' <span style="color:var(--danger);font-weight:600">✗ 答错(错一字不得分)</span>'}</div>`;
    html += `<div style="margin-top:6px"><span class="label">参考答案：</span><strong>${escapeHtml(q.answer)}</strong></div>`;
  } else {
    html = `<div><span class="label">您的答案：</span><strong>${escapeHtml(myStr||'（未填写）')}</strong></div>`;
    html += `<div style="margin-top:6px"><span class="label">📖 本题无标准答案</span></div>`;
  }
  if(q.explain){
    html += `<div style="margin-top:8px"><span class="label">解析：</span>${escapeHtml(q.explain)}</div>`;
  }
  exp.innerHTML = html;
  // 锁定输入
  if(isArr){
    document.querySelectorAll('.q-blank-input').forEach(inp=>{ inp.disabled = true; inp.style.background = '#f7fafc'; });
  } else {
    const ta = document.getElementById('q-fill-input');
    if(ta){ ta.disabled = true; ta.style.background = '#f7fafc'; }
  }
  const nav = document.getElementById('q-nav');
  if(q.answer && myStr){
    nav.innerHTML = matched ? '<span style="color:var(--success);font-weight:600">✓ 答对</span>' : '<span style="color:var(--danger);font-weight:600">✗ 答错</span>';
  } else {
    nav.textContent = '已查看';
  }
}

function showResult(L, isRestoring){
  const q = questions[curIdx];
  const type = q.type in TYPE_TAG ? q.type : 'single';
  const opts = document.querySelectorAll('#q-options .option');
  const myAns = (L||'');
  const mySorted = sortAns(myAns);
  const correctSorted = sortAns(q.answer||'');
  let matched = false;
  if(q.answer){
    matched = mySorted===correctSorted;
  }
  if(isChoice(q)){
    opts.forEach(o=>{
      if(!isRestoring) o.onclick = null;
      o.classList.add('locked');
      const l = o.dataset.letter;
      // 正确答案中的选项
      if(q.answer && q.answer.includes(l)) o.classList.add('correct');
      // 我选错的
      else if(myAns.includes(l)) o.classList.add('wrong');
      if(myAns.includes(l) && q.answer && q.answer.includes(l)) o.classList.remove('wrong');
    });
  }
  // 解析区
  const exp = document.getElementById('q-explain');
  exp.classList.remove('hidden');
  let html = '';
  if(q.answer){
    if(type==='judge'){
      const ansText = q.answer==='A' ? '正确 ✓' : '错误 ✗';
      html = `<div><span class="label">正确答案：</span><strong>${ansText}</strong></div>`;
    } else if(isChoice(q)){
      html = `<div><span class="label">正确答案：</span><strong>${q.answer.split('').join('、')}</strong>${q.answer.length>1?'（多选）':''}</div>`;
    } else if(type==='essay'||type==='fill'){
      html = `<div><span class="label">参考答案：</span><strong>${escapeHtml(q.answer)}</strong></div>`;
    } else {
      html = `<div><span class="label">正确答案：</span><strong>${q.answer}</strong>${q.options[q.answer]?` <span style="color:var(--text-light)">· ${escapeHtml(q.options[q.answer])}</span>`:''}</div>`;
    }
  } else {
    html = '<div><span class="label">📖 浏览题：</span>本题无标准答案，请查阅资料</div>';
  }
  if(q.explain){
    html += `<div style="margin-top:8px"><span class="label">解析：</span>${escapeHtml(q.explain)}</div>`;
  }
  exp.innerHTML = html;
  const nav = document.getElementById('q-nav');
  if(q.answer && isChoice(q)){
    nav.innerHTML = matched ? '<span style="color:var(--success);font-weight:600">✓ 答对</span>' : '<span style="color:var(--danger);font-weight:600">✗ 答错</span>';
  } else if(q.answer && !isChoice(q)){
    nav.textContent = '已查看答案';
  } else {
    nav.textContent = '已查看';
  }
}

/* ====== 结果 ====== */
function isCorrectForType(q, myAns){
  if(!isGradable(q)) return false;
  const type = q.type in TYPE_TAG ? q.type : 'single';
  if(type==='essay'||type==='fill') return isFillMatch(myAns, q.answer);
  return sortAns(q.answer)===sortAns(myAns);
}

function showFinalResult(){
  if(EXAM_MODE){
    // 考试模式：按分值计分
    let earned = 0, maxTotal = 0, correctN = 0, wrongN = 0;
    let byType = {};   // type -> {earned, max, correct}
    questions.forEach((q,i)=>{
      if(!isGradable(q)) return;
      const sc = examScores[i]||0;
      const type = q.type in TYPE_TAG ? q.type : 'single';
      if(!byType[type]) byType[type] = {earned:0, max:0};
      byType[type].max += sc;
      maxTotal += sc;
      const ok = isCorrectForType(q, answers[i]||'');
      if(ok){ earned += sc; correctN++; byType[type].earned += sc; }
      else wrongN++;
    });
    document.getElementById('er-score').textContent = `${earned} / ${maxTotal}`;
    document.getElementById('er-label').textContent = '考试得分'+(examEntry?` · ${examEntry.name}`:'');
    document.getElementById('er-correct').textContent = correctN;
    document.getElementById('er-wrong').textContent = wrongN;
    document.getElementById('er-total').textContent = questions.length;
    // 分题型得分汇总
    let bt = '';
    EXAMS.find(e=>e.id===(examEntry?examEntry.id:-1))?.sections.forEach(sec=>{
      const b = byType[sec.type];
      if(!b) return;
      const tag = TYPE_TAG[sec.type];
      bt += `<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;margin-top:6px;background:var(--gray-light);border-radius:10px;font-size:14px">`;
      bt += `<span style="color:var(--text-light)">${tag}</span>`;
      bt += `<span style="font-weight:700">${b.earned} / ${b.max} <span style="font-size:11px;color:var(--gray);font-weight:400">分</span></span></div>`;
    });
    document.getElementById('er-bytype').innerHTML = bt;
    showView('view-exam-result');
    return;
  }
  let total=0, correct=0, wrong=0, browse=0;
  questions.forEach((q,i)=>{
    if(!isGradable(q)){ browse++; return; }
    total++;
    const myAns = answers[i]||'';
    const type = q.type in TYPE_TAG ? q.type : 'single';
    if(type==='essay'||type==='fill'){
      // 填空/问答：与参考答案严格匹配
      const matched = isFillMatch(myAns, q.answer);
      if(matched) correct++; else wrong++;
    } else {
      if(sortAns(q.answer)===sortAns(myAns)) correct++; else wrong++;
    }
  });
  const score = total>0 ? Math.round(correct*100/total) : 0;
  document.getElementById('r-score').textContent = total>0?`${score}%`:'—';
  document.getElementById('r-label').textContent = total>0?'本次成绩':(browse>0?'本次全部为浏览题':'本次未做可判分题');
  document.getElementById('r-correct').textContent = correct;
  document.getElementById('r-wrong').textContent = wrong;
  document.getElementById('r-total').textContent = total;
  showView('view-result');
}

function showReview(){
  const list = document.getElementById('review-list');
  list.innerHTML = '';
  const items = [];
  questions.forEach((q,i)=>{
    const myAns = answers[i]||'';
    const isWrong = isGradable(q) && sortAns(q.answer)!==sortAns(myAns);
    if(isWrong) items.push({q, userAns:myAns});
  });
  const browse = questions.filter(q=>!isGradable(q));
  if(items.length===0 && browse.length===0){
    list.innerHTML = '<div class="empty"><div class="icon">🎉</div><p>全部答对！</p></div>';
  } else {
    let html = '';
    if(items.length>0){
      html += `<div class="card"><h2 style="font-size:16px;margin-bottom:6px">❌ 错题回顾（${items.length}）</h2></div>`;
      items.forEach(({q,userAns},i)=> html += renderReviewItem(q,userAns,`错题 ${i+1}`));
    }
    if(browse.length>0){
      html += `<div class="card" style="margin-top:18px"><h2 style="font-size:16px;margin-bottom:6px">📖 浏览题（${browse.length}）</h2></div>`;
      browse.slice(0,30).forEach((q,i)=> html += renderReviewItem(q,null,`浏览 ${i+1}`));
      if(browse.length>30) html += `<div class="card" style="text-align:center;color:var(--gray)">… 还有 ${browse.length-30} 题</div>`;
    }
    list.innerHTML = html;
  }
  showView('view-review');
}
function renderReviewItem(q, userAns, label){
  const type = q.type in TYPE_TAG ? q.type : 'single';
  let html = `<div class="card">`;
  html += `<div class="q-type-info">${TYPE_TAG[type]||'题'} · ${label}${q.answer_inferred?' <span class="pill pill-blue">推断</span>':''}</div>`;
  html += `<div class="q-stem" style="font-size:15px">${escapeHtml(q.stem)}</div>`;
  if(isChoice(q)){
    html += `<div style="display:flex;flex-direction:column;gap:8px;margin-top:12px">`;
    Object.keys(q.options).forEach(L=>{
      let cls='option locked';
      if(q.answer && q.answer.includes(L)) cls+=' correct';
      else if(userAns && userAns.includes(L)) cls+=' wrong';
      const letterHtml = type==='judge' ? `<div class="letter judge-letter ${L==='A'?'right':'wrong'}"></div>` : `<div class="letter">${L}</div>`;
      html += `<div class="${cls}" style="margin:0">${letterHtml}<div>${escapeHtml(q.options[L])}</div></div>`;
    });
    html += `</div>`;
  }
  if(q.answer){
    let ansText;
    if(type==='judge') ansText = q.answer==='A' ? '正确 ✓' : '错误 ✗';
    else if(isChoice(q)) ansText = q.answer.split('').join('、');
    else ansText = escapeHtml(q.answer);
    html += `<div class="explain-box"><span class="label">${q.type==='essay'||q.type==='fill'?'参考答案':'正确答案'}：</span><strong>${ansText}</strong></div>`;
  } else {
    html += `<div class="explain-box" style="background:#eef2ff;border-color:#c3dafe"><span class="label" style="color:#3730a3">📖 浏览题</span></div>`;
  }
  if(q.explain) html += `<div class="explain-box" style="margin-top:8px;background:#f7fafc;border-color:var(--gray-light)"><span class="label" style="color:var(--text-light)">解析：</span>${escapeHtml(q.explain)}</div>`;
  html += '</div>';
  return html;
}
